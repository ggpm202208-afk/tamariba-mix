<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0C0A">
<title>MIX バランス確認</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#0A0C0A;--panel:#111511;--panel-2:#171D17;--line:#282F28;--line-2:#3A443A;
  --bone:#EDE9DB;--dim:#8C948A;
  --red:#E04A33;--red-soft:#F07A63;--blue:#5A8DF2;--blue-soft:#8FB2F7;--amber:#E8A63C;--green:#6FBF86;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",YuGothic,Meiryo,system-ui,sans-serif;
}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:
    radial-gradient(120% 70% at 50% -18%, rgba(74,116,86,.22), transparent 62%),
    radial-gradient(90% 55% at 105% 112%, rgba(224,74,51,.10), transparent 62%),
    var(--ink);
  color:var(--bone);font-family:var(--jp);-webkit-font-smoothing:antialiased;
  min-height:100dvh;overscroll-behavior:none;
}
.app{width:100%;max-width:560px;margin:0 auto;padding:18px 16px calc(26px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column;gap:14px;overflow-x:clip}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}

/* header */
.hud{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);background:rgba(10,12,10,.72);backdrop-filter:blur(6px);position:sticky;top:6px;z-index:5}
.hud-name{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:#C9C6B6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.hud-state{flex:1;text-align:right;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.hud-state.on{color:#C9C6B6}
.sig{width:6px;height:6px;border-radius:50%;background:#3D4A3D;flex:none}
.sig.live{background:var(--green);box-shadow:0 0 8px rgba(111,191,134,.9)}

.stage{display:flex;flex-direction:column;gap:13px;flex:1;min-width:0}

/* question */
.q.sub-q{font-size:clamp(20px,5.6vw,24px);letter-spacing:-.02em;margin-top:2px}
.q{font-size:clamp(32px,9.6vw,42px);font-weight:900;letter-spacing:-.04em;line-height:1.02;margin:6px 0 0}
.q small{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--dim);margin-bottom:9px;font-family:var(--mono)}
.sub{font-size:12.5px;line-height:1.7;color:var(--dim);margin:0}
.sub b{color:#B8BDB2;font-weight:700}

/* choices */
.choice{position:relative;width:100%;max-width:100%;display:flex;align-items:center;gap:14px;padding:19px 16px;border:1px solid #3A2A26;background:linear-gradient(180deg,#241A17,#161110);color:var(--bone);border-radius:2px;cursor:pointer;text-align:left;font-family:var(--jp);border-left:4px solid var(--red);transition:transform .08s ease,box-shadow .18s,opacity .18s,padding .2s}
.choice .c-body{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.choice .c-label{font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.choice .c-sub{font-size:11.5px;color:#A79C97}
.choice .c-mark{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:transparent;border:1px solid transparent;padding:4px 6px;white-space:nowrap;flex:none}
.choice.blue{border-color:#22304E;border-left-color:var(--blue);background:linear-gradient(180deg,#141B29,#0F131B)}
.choice.blue .c-sub{color:#93A0B8}
.choice:active{transform:translateY(1px)}
.choice.on{box-shadow:0 0 0 1px var(--red),0 0 30px rgba(224,74,51,.16)}
.choice.blue.on{box-shadow:0 0 0 1px var(--blue),0 0 30px rgba(90,141,242,.16)}
.choice.on .c-mark{color:var(--bone);border-color:rgba(237,233,219,.3);background:rgba(237,233,219,.08)}
.choice.dimmed{opacity:.4}
.choice.compact{padding:12px 15px}
.choice.compact .c-label{font-size:18px}
.choice.compact .c-sub{display:none}

.mine{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);justify-content:center;padding:1px 0;flex-wrap:wrap;text-align:center}
.mine b{color:#C9C6B6;font-weight:700}
.mine button{background:none;border:0;color:var(--dim);font-size:11.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-family:var(--jp);padding:5px}

/* status strip */
.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);background:rgba(23,29,23,.55);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.strip .n{color:#C9C6B6}
.bar{height:2px;background:#232B23;overflow:hidden;margin-top:-13px}
.bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .9s linear}

/* result */
.ann{border:1px solid var(--line-2);background:linear-gradient(180deg,#1A211A,#10150F);padding:17px;display:flex;flex-direction:column;gap:11px;min-width:0;animation:rise .35s ease}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
.ann-head{font-size:clamp(32px,10vw,44px);font-weight:900;letter-spacing:-.045em;line-height:1.02;margin:0}
.ann-head.red{color:var(--red-soft)}.ann-head.blue{color:var(--blue-soft)}.ann-head.amber{color:var(--amber)}
.ann-body{font-size:13.5px;line-height:1.7;color:#C4CABE;margin:0;white-space:pre-line}
.split{display:flex;height:10px;gap:2px;background:#1B221B;border:1px solid var(--line);overflow:hidden}
.split i{display:block;height:100%}
.split .s-r{background:var(--red)}.split .s-b{background:var(--blue)}
.counts{display:flex;gap:2px}
.count{flex:1;padding:2px;display:flex;flex-direction:column;gap:3px;min-width:0}
.count .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--dim);overflow-wrap:anywhere}
.count .v{font-family:var(--mono);font-size:23px;font-weight:600;line-height:1}
.count.r .v{color:var(--red-soft)}.count.b .v{color:var(--blue-soft)}
.wh-line{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
.wh-line .ok{color:var(--green)}.wh-line .ng{color:#C9705F}
.mini{appearance:none;border:1px solid var(--line-2);background:#1C231C;color:#C9C6B6;font-family:var(--jp);font-size:12px;padding:9px 12px;border-radius:2px;cursor:pointer}
.mini:hover{background:#232B23}

/* settings */
details.host{border:1px solid var(--line);background:rgba(23,29,23,.4)}
details.host > summary{list-style:none;cursor:pointer;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
details.host > summary::-webkit-details-marker{display:none}
details.host > summary::after{content:"+";font-size:14px;color:var(--line-2)}
details.host[open] > summary::after{content:"\2212"}
details.host .inner{padding:0 13px 13px;display:flex;flex-direction:column;gap:9px}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin:2px 0 -3px}
input{font-family:var(--jp);font-size:14px;color:var(--bone);background:#0D110D;border:1px solid var(--line-2);border-radius:2px;padding:10px 11px;width:100%;appearance:none;-webkit-appearance:none}
input:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.row{display:flex;gap:8px}
.row > *{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:#C4CABE;padding:2px 0}
.switch{position:relative;width:40px;height:23px;flex:none;background:#242B24;border:1px solid var(--line-2);border-radius:99px;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;background:#6B746A;border-radius:50%;transition:transform .15s,background .15s}
.switch.on{background:#1E3A26;border-color:#2F6B41}
.switch.on::after{transform:translateX(17px);background:var(--green)}
.tab{appearance:none;background:none;border:1px solid transparent;color:var(--dim);font-family:var(--jp);font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:2px;cursor:pointer;letter-spacing:.02em}
.tab.on{background:#1E2620;border-color:var(--line-2);color:var(--bone)}
.readonly{display:flex;flex-direction:column;gap:5px;padding:15px 14px;border:1px dashed var(--line-2);background:rgba(23,29,23,.5);text-align:center}
.readonly .ro-l{font-size:14px;letter-spacing:.04em}
.readonly .ro-s{font-size:12px;color:var(--dim);line-height:1.55}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{aspect-ratio:1;border:1px solid var(--line);background:#0E130E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:3px;font-family:var(--mono);font-size:15px;color:var(--dim);border-radius:2px;overflow:hidden}
.slot.filled img{width:32px;height:32px;border-radius:50%;object-fit:cover;display:block}
.slot.filled b{font-family:var(--jp);font-size:9px;font-weight:600;line-height:1.1;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#DDE3D8}
.chip img{width:15px;height:15px;border-radius:50%;object-fit:cover;vertical-align:-3px;margin-right:3px}
.slot.filled{background:#1B2A1E;border-color:#2F6B41;color:#C6E4CD}
.roster{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;padding:4px 8px;border:1px solid var(--line);background:#141A14;border-radius:2px;color:#B8BDB2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.mine-name{border-color:#3A5A42;color:#C6E4CD}
.chip.tent{border-color:#4A4229;color:#D8C48A;background:#1A1710}
.team{border:1px solid var(--line);background:linear-gradient(180deg,#171D17,#101510);padding:12px;display:flex;flex-direction:column;gap:5px}
.team.red{border-left:3px solid var(--red)}
.team.blue{border-left:3px solid var(--blue)}
.team-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:3px}
.team-sum{font-family:var(--mono);font-size:17px;font-weight:600}
.team.red .team-sum{color:var(--red-soft)}
.team.blue .team-sum{color:var(--blue-soft)}
.prow.tappable{cursor:pointer;user-select:none}
.prow.tappable:active{opacity:.55}
.prow{display:flex;justify-content:space-between;font-size:13px;color:#C4CABE;gap:8px}
.prow b{font-family:var(--mono);font-size:11.5px;color:var(--dim);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:var(--bone);color:#0A0C0A;font-size:12.5px;font-weight:700;padding:11px 16px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ================= 設定 ================= */
var RELAY='https://ntfy.sh';
var TOKEN_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var MIN_VOTES=3;          // これ集まったら結論
var QUIET=45;             // 発表後、次の受付までの静寂(秒)
var DEFAULT_CHANNEL='mgo2pc-mix';
var HEARTBEAT=7000;

/* ================= 状態 ================= */
var S={
  cid:rid(8),
  channel:'',
  log:[],            // 投票ログ（全員が同じ順序で再生）
  st:null,           // 再生結果
  mine:null,         // 今のラウンドで自分が入れた選択
  connected:false,
  webhook:'', notify:true,
  peers:{},          // cid -> {at, w}
  posted:{},         // 送信済み epoch
  started:false,
  mode:'recruit',      // recruit | balance
  name:'',
  cap:12,
  rlog:[],             // 募集ログ（Discordから届いた確定分）
  rlogWeb:[],          // 募集ログ（このページで「集まる」を押した分）
  rpeers:{},
  players:[], playersAt:0, sheetId:'1OGmjsQHj6SRsgA0OK1m9BhB3-MityX7Exs-niAhe9IM', gid:'1501436294',
  teams:null,
  proxy:'', expBusy:false, expLog:[]
};
var es=null, tickTimer=null, hbTimer=null, lastHeartbeat=0, lastPostAt=-1;

/* ================= ユーティリティ ================= */
function rid(n){var s='';for(var i=0;i<n;i++)s+=TOKEN_CHARS[Math.floor(Math.random()*TOKEN_CHARS.length)];return s;}
function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pad(n){n=String(n);return n.length<2?'0'+n:n>99?'99':n;}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on');},2400);}
function nowSec(){return Date.now()/1000;}
function vibrate(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
function copy(text,label){
  var done=function(){toast(label||'コピーしました');};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fb);}else{fb();}
  function fb(){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('コピーできませんでした');}document.body.removeChild(ta);}
}

/* ================= コア: ログ再生 =================
   全員が同じログを同じ順序で再生するので、ホストもサーバーも要らない。
   時刻はリレーが付けた ts を使うので、端末の時計がずれていても結論は一致する。 */
function delayFor(epoch){
  var s='d'+epoch, h=0, i;
  for(i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0;
  return 10 + (Math.abs(h)%16);      // 10〜25秒（ラウンドごとに変わる）
}
function playLog(log, n){
  var epoch=0, votes={}, anns=[], quietUntil=0, i, k, r, b, kind, at;
  for(i=0;i<log.length;i++){
    var e=log[i];
    if(e.rs){ votes={}; continue; }
    if(typeof e.c!=='string') continue;
    if((e.ts||0)<quietUntil) continue;
    votes[e.cid]=e.c;
    r=0;b=0;
    for(k in votes){ if(votes[k]==='r')r++; else if(votes[k]==='b')b++; }
    kind=null;
    if(r+b>=MIN_VOTES){
      if(r>=MIN_VOTES&&r>b) kind='red';
      else if(b>=Math.ceil(n/2)&&b>r) kind='blue';
    }
    if(kind){
      at=(e.ts||nowSec())+delayFor(epoch);
      anns.push({e:epoch,r:r,b:b,k:kind,at:at});
      quietUntil=at+QUIET;
      epoch++; votes={};
    }
  }
  r=0;b=0;
  for(k in votes){ if(votes[k]==='r')r++; else if(votes[k]==='b')b++; }
  var last=anns.length?anns[anns.length-1]:null;
  return {epoch:epoch,r:r,b:b,anns:anns,last:last,
          pending:!!(last&&nowSec()<last.at)};
}
function verdict(kind,r,b,n){
  if(kind==='red') return {head:'振り直しを推奨',cls:'red',body:'振り直したい '+r+' / このまま '+b+'（'+n+'人中）\n基準を超えたので、次の試合は組み直しで。'};
  if(kind==='blue') return {head:'このまま続行',cls:'blue',body:'このまま '+b+' / 振り直したい '+r+'（'+n+'人中）\nこの話題はここで終了で。'};
  return {head:'このまま続行',cls:'blue',body:'このまま '+b+' / 振り直したい '+r+'（'+n+'人中）\nこの話題はここで終了で。'};
}

/* ================= タブ ================= */
function tabsHTML(cur){
  return '<button class="tab'+(cur==='recruit'?' on':'')+'" data-act="mode" data-m="recruit">募集</button>'+
         '<button class="tab'+(cur==='balance'?' on':'')+'" data-act="mode" data-m="balance">バランス</button>'+
         '<button class="tab'+(cur==='alloc'?' on':'')+'" data-act="mode" data-m="alloc">振り分け</button>';
}

/* ================= 描画 ================= */
function render(){
  var app=$('#app');
  if(S.mode==='recruit'){app.innerHTML=renderRecruit();return;}
  if(S.mode==='alloc'){app.innerHTML=renderAlloc();return;}
  var n=S.n||12;
  var st=S.st||playLog([],n);
  var v=st.last?verdict(st.last.k,st.last.r,st.last.b,n):null;
  var showResult=!!(v&&nowSec()>=st.last.at);
  var cooling=!!(st.last&&nowSec()<st.last.at+QUIET);
  var compact=showResult||cooling;
  var mine=currentMine(st);

  var html='';
  html+='<header class="hud">'+
    tabsHTML('balance')+
    '<span class="hud-name">'+esc(S.channel||'—')+'</span>'+
    '<span class="hud-state'+(showResult?' on':'')+'" id="hudState">'+stateText(st)+'</span>'+
    '<span class="sig'+(S.connected?' live':'')+'" id="sig"></span>'+
  '</header>';

  html+='<div class="stage">';

  if(showResult){
    html+='<div class="ann">'+
      '<div class="mono">RESULT</div>'+
      '<h2 class="ann-head '+v.cls+'">'+v.head+'</h2>'+
      splitHTML(st.last,n)+
      countsHTML(st.last,n)+
      '<p class="ann-body">'+esc(v.body)+'</p>'+
      '<div class="wh-line" id="whLine">'+webhookLine(st.last)+'</div>'+
      '<button class="mini" data-act="copyResult" style="align-self:flex-start">結果をコピー</button>'+
    '</div>';
  }

  html+='<div class="q"><small>'+(compact?'次の試合に向けて':'今のチームのままいい？')+'</small>'+(compact?'どうする？':'組み直す？')+'</div>';

  html+='<button class="choice'+(compact?' compact':'')+(mine==='r'?' on':(mine?' dimmed':''))+'" data-act="vote" data-c="r">'+
        '<span class="c-body"><span class="c-label">振り直したい</span><span class="c-sub">バランスを取り直す</span></span>'+
        '<span class="c-mark">'+(mine==='r'?'受付済':'—')+'</span></button>';
  html+='<button class="choice blue'+(compact?' compact':'')+(mine==='b'?' on':(mine?' dimmed':''))+'" data-act="vote" data-c="b">'+
        '<span class="c-body"><span class="c-label">このまま</span><span class="c-sub">今のチームで続ける</span></span>'+
        '<span class="c-mark">'+(mine==='b'?'受付済':'—')+'</span></button>';

  html+='<div class="mine" id="mineLine">'+(mine
        ? 'このラウンドは <b>'+(mine==='r'?'振り直したい':'このまま')+'</b> で受付済み · <button data-act="undo">取り消す</button>'
        : '押したことは他の人に伝わりません')+'</div>';

  html+='<div class="strip"><span id="stripLeft">'+stateText(st)+'</span><span class="n" id="stripRight">'+counterText(st)+'</span></div>';
  html+='<div class="bar"><i id="barFill"></i></div>';

  html+=settingsHTML();

  html+='</div>';
  app.innerHTML=html;
  tickBar();
}

function currentMine(st){
  if(!S.mine) return null;
  return S.mine.epoch===st.epoch ? S.mine.c : null;
}
function stateText(st){
  if(st.pending) return '集計中';
  if(st.last&&nowSec()<st.last.at+QUIET) return '静寂 '+(Math.ceil(st.last.at+QUIET-nowSec()))+'s';
  return '受付中';
}
function counterText(st){
  var t=st.r+st.b;
  if(st.pending) return 'あと'+Math.max(0,Math.ceil(st.last.at-nowSec()))+'s';
  if(t>0) return t+'人 受付';
  return '0人';
}
function splitHTML(a,n){
  var total=n||1,s='';
  if(a.r>0) s+='<i class="s-r" style="width:'+Math.min(100,a.r/total*100)+'%"></i>';
  if(a.b>0) s+='<i class="s-b" style="width:'+Math.min(100,a.b/total*100)+'%"></i>';
  return '<div class="split">'+s+'</div>';
}
function countsHTML(a,n){
  return '<div class="counts">'+
    '<div class="count r"><span class="k">振り直したい</span><span class="v">'+a.r+'</span></div>'+
    '<div class="count b"><span class="k">このまま</span><span class="v">'+a.b+'</span></div>'+
    '<div class="count"><span class="k">未投票</span><span class="v">'+Math.max(0,n-a.r-a.b)+'</span></div>'+
  '</div>';
}
function webhookLine(a){

function dateKey(){
  var d=new Date(Date.now()+9*3600*1000);   // JST基準で日付が変わる＝毎日自動リセット
  return d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate());
}
function pad2(n){return n<10?'0'+n:''+n;}
function topicName(){
  var base=S.channel||DEFAULT_CHANNEL;
  return S.mode==='recruit'?(base+'-r'):base;
}
function publish(obj){
  try{fetch(RELAY+'/'+encodeURIComponent(topicName()),{method:'POST',body:JSON.stringify(obj),cache:'no-store'}).catch(function(){});}catch(e){}
}
function connect(){
  if(es){es.close();es=null;}
  S.log=[];S.rlog=[];S.rlogWeb=[];S.st=playLog([],S.n||12);
  es=new EventSource(RELAY+'/'+encodeURIComponent(topicName())+'/sse?since=all');
  es.onopen=function(){S.connected=true;hb(true);render();};
  es.onerror=function(){S.connected=false;var s=$('#sig');if(s)s.className='sig';};
  es.onmessage=function(ev){
    var d;try{d=JSON.parse(ev.data);}catch(_){return;}
    if(d.event!=='message'||!d.message)return;
    var m;try{m=JSON.parse(d.message);}catch(_){return;}
    onMsg(m,d.time);
  };
}
function onMsg(m,relayTs){
  if(!m||!m.t)return;
  if(m.t==='hb'){
    if(m.cid&&m.cid!==S.cid){S.peers[m.cid]={at:nowSec(),w:!!m.w};}
    return;
  }
  if(m.t==='wp'){ if(typeof m.e==='number'){S.posted[m.e]=true;} return; }
  if(m.t==='j'){
    if(!m.cid)return;
    S.rlogWeb.push({cid:m.cid,n:(m.n||'?').slice(0,16),ts:relayTs||m.ts||nowSec()});
    refreshRecruit();return;
  }
  if(m.t==='q'){
    if(!m.cid)return;
    S.rlogWeb.push({cid:m.cid,quit:true,ts:relayTs||m.ts||nowSec()});
    refreshRecruit();return;
  }
  if(m.t==='snap'){
    // 新しい募集が立ったら、前の回の表示は捨てる
    if(m.sid){
      if(S.sid&&m.sid!==S.sid){ S.rlog=[]; S.dcAlloc=null; }
      S.sid=m.sid;
    }
    // 文字列でも {n,a} でも壊れないように正規化する
    var avm=m.av||{};
    var nm=function(x){ return (x&&typeof x==='object') ? String(x.n||x.name||'?') : String(x==null?'?':x); };
    var af=function(x){ return (x&&typeof x==='object'&&x.a) ? x.a : (avm[nm(x)]||null); };
    var lset={}; (m.lis||[]).forEach(function(x){ lset[nm(x)]=1; });
    var seen={};
    var cc=(m.members||[]).map(function(x,i){ var k=nm(x); seen[k]=1; return {cid:'dc'+i,n:k.slice(0,24),av:af(x),ts:nowSec(),lis:!!lset[k]};});
    // 聞き専(🎧)は members/tent に入らないので、ここで足す（Web側だけ欠けていた）
    (m.lis||[]).forEach(function(x,i){ var k=nm(x); if(seen[k])return; seen[k]=1;
      cc.push({cid:'dl'+i,n:k.slice(0,24),av:af(x),ts:nowSec(),lis:true}); });
    var tt=(m.tent||[]).map(function(x,i){ var k=nm(x); if(seen[k])return null; seen[k]=1;
      return {cid:'dt'+i,n:k.slice(0,24),av:af(x),ts:nowSec(),tent:true};}).filter(Boolean);
    S.rlog=cc.concat(tt);   // Discord分のみ。Web参加(rlogWeb)は別管理なので消えない
    S.dcCount=m.count||0;
    if(S.cap)S.cap=m.cap||S.cap;
    if(S.players&&S.players.length)rebuildPool();
    refreshRecruit();return;
  }
  if(m.t==='alloc'){
    if(m.sid&&S.sid&&m.sid!==S.sid)return;   // 前の回の結果は表示しない
    S.dcAlloc=m; refreshRecruit(); return;
  }
  if(m.t==='rs'){ S.log.push({rs:true,ts:m.ts||relayTs||nowSec()}); refresh(); return; }
  if(m.t==='v'){
    if(!m.cid||(m.c!=='r'&&m.c!=='b'))return;
    S.log.push({cid:m.cid,c:m.c,ts:relayTs||m.ts||nowSec(),id:m.id});
    refresh();
    return;
  }
}
function hb(force){
  var now=nowSec();
  if(!force&&now-lastHeartbeat<HEARTBEAT)return;
  lastHeartbeat=now;
  publish({t:'hb',cid:S.cid,w:!S.webhook?0:1,ts:Math.floor(now)});
  // 死んだピアを掃除
  var k;for(k in S.peers){if(now-S.peers[k].at>20000)delete S.peers[k];}
}

   日付が変わると自動でリセット（合言葉に日付が入るため）。 */
function playRecruit(log,cap){
  var list=[],idx={},i;
  for(i=0;i<log.length;i++){
    var e=log[i];
    if(!e.cid)continue;
    if(e.quit){ if(idx[e.cid]!==undefined){list.splice(idx[e.cid],1);idx={};for(var j=0;j<list.length;j++)idx[list[j].cid]=j;} continue; }
    if(idx[e.cid]!==undefined){
      var cur=list[idx[e.cid]];
      cur.n=e.n||cur.n;
      if(e.av)cur.av=e.av;          // アイコンは後から届いた方を優先
      continue;
    }
    list.push({cid:e.cid,n:e.n||'?',av:e.av||null,ts:e.ts});
    idx[e.cid]=list.length-1;
  }
  return {list:list,count:list.length,full:list.length>=cap,cap:cap};
}

/* ================= 振り分け（シート直読み＋6v6最適化） ================= */
function csvRows(text){
  var rows=[],row=[],cur='',q=false,i;
  for(i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c!=='\r') cur+=c;
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function parsePlayers(text){
  var rows=csvRows(text),out=[],i,hdr=-1;
  for(i=0;i<rows.length;i++){
    if((rows[i][1]||'').indexOf('プレイヤー名')>=0){hdr=i;break;}
  }
  if(hdr<0)return out;
  for(i=hdr+1;i<rows.length;i++){
    var r=rows[i];
    if(!r||!r[1]||!r[1].trim())continue;
    var name=r[1].trim().slice(0,16);
    var c=String(r[2]||'').trim(), d=String(r[3]||'').trim(), e=String(r[4]||'').trim();
    var exp, alias, fix;
    if(c.indexOf('mgo2pc.com')>=0){
      // プレイヤーDB: B=名前 / C=URL / D=Experience / E=Discord名 / F=固定チーム
      exp=parseFloat(d.replace(/[^0-9.\-]/g,''));
      alias=e; fix=String(r[5]||'').trim();
    }else{
      // 旧レイアウト: B=名前 / C=Experience / D=固定チーム
      exp=parseFloat(c.replace(/[^0-9.\-]/g,''));
      alias=''; fix=d;
    }
    if(isNaN(exp))continue;
    out.push({name:name,exp:exp,fix:(fix||'なし'),
      alias:String(alias||'').split(/[,、|\/]+/).map(function(x){return x.trim();}).filter(Boolean)});
  }
  return out;
}
function nk(v){return String(v||'').toLowerCase().replace(/[\s　_\-・.]/g,'');}
function poolKeys(p){return [p.name].concat(p.alias||[]).map(nk).filter(Boolean);}

/* DB全員＋募集メンバーを1つのプールにまとめる */
function rebuildPool(){
  var prev={};
  (S.players||[]).forEach(function(q){prev[nk(q.name)]=q.on;});
  var byKey={};
  (S.players||[]).forEach(function(q){poolKeys(q).forEach(function(k){if(!byKey[k])byKey[k]=q;});});
  (S.players||[]).forEach(function(q){q.part=false;q.on=false;});
  (S.rlog||[]).forEach(function(x){
    if(x.quit||!x.n)return;
    var k0=nk(x.n);
    var hit=byKey[k0];
    if(!hit){
      // 部分一致でも拾う（「レイザー（本物）」→「レイザー」など）
      var cands=[];
      (S.players||[]).forEach(function(q){
        poolKeys(q).forEach(function(k){
          if(k&&(k0.indexOf(k)>=0||k.indexOf(k0)>=0))cands.push(q);
        });
      });
      if(cands.length===1)hit=cands[0];
    }
    if(hit){hit.part=true;hit.on=true;if(x.lis)hit.lis=true;}
    else{
      var np={name:x.n,exp:0,fix:'なし',alias:[],part:true,on:true,lis:!!x.lis,unregistered:true};
      S.players.push(np);
      nk(x.n)&&(byKey[nk(x.n)]=np);
    }
  });
  (S.players||[]).forEach(function(q){
    if(prev[nk(q.name)]===true&&!q.part)q.on=true;   // 手動で選んでいた人は維持
  });
}
function pickedPlayers(){return (S.players||[]).filter(function(p){return p.on;});}
function sheetURL(){
  // プレイヤーDB（19人の名簿）を読む。gid ではなくシート名で指定する。
  return 'https://docs.google.com/spreadsheets/d/'+encodeURIComponent(S.sheetId)+

function fetchSheet(){
  if(!S.sheetId){toast('シートIDが空です');return;}
  toast('シートを読み込み中…');
  fetch(sheetURL(),{cache:'no-store'})

    .then(function(t){

      S.players=ps;S.playersAt=Date.now();S.teams=null;rebuildPool();
      saveLS('mixvote.players',JSON.stringify(ps));
      saveLS('mixvote.playersAt',String(S.playersAt));

    })
    .catch(function(e){toast('読み込み失敗: '+e.message+'（リンク共有になっているか確認）');});
}
function fixSide(f){
  f=String(f||'').trim().toUpperCase();
  if(f.indexOf('A')===0||f.indexOf('赤')===0||f==='1')return 'A';
  if(f.indexOf('B')===0||f.indexOf('青')===0||f==='2')return 'B';
  return null;
}
function allocate(){
  var all=pickedPlayers().slice();
  if(all.length<2){toast('選んだ人が足りません（2人以上）');return;}
  var bench=null;
  if(all.length%2===1){
    // 余り1人は補欠。参加者より「DBから追加した人」を優先して外す
    var cands=all.filter(function(p){return !p.part;});
    bench=(cands.length?cands[cands.length-1]:all[all.length-1]);
    all=all.filter(function(p){return p!==bench;});
  }
  var ps=all;
  S.bench=bench;
  var n=ps.length, half=Math.floor(n/2);
  if(n>16){ toast('16人まで対応しています'); return; }
  var fixedA=[],fixedB=[],rest=[];
  ps.forEach(function(p){
    var s=fixSide(p.fix);
    if(s==='A')fixedA.push(p); else if(s==='B')fixedB.push(p); else rest.push(p);
  });
  var needA=half-fixedA.length, needB=n-half-fixedB.length;
  if(needA<0||needB<0){toast('固定チームの指定が人数と矛盾しています');return;}
  var best=null,i;
  // 残りから needA 人を選ぶ組み合わせを全探索（C(12,6)=924）
  var idx=[];
  for(i=0;i<rest.length;i++)idx.push(i);
  function comb(arr,k,start,cur,out){
    if(cur.length===k){out.push(cur.slice());return;}
    for(var x=start;x<arr.length;x++){cur.push(arr[x]);comb(arr,k,x+1,cur,out);cur.pop();}
  }
  var combos=[];comb(idx,needA,0,[],combos);
  combos.forEach(function(c){
    var A=fixedA.concat(c.map(function(j){return rest[j];}));
    var B=fixedB.concat(rest.filter(function(_,j){return c.indexOf(j)<0;}));
    var sa=A.reduce(function(a,p){return a+p.exp;},0);
    var sb=B.reduce(function(a,p){return a+p.exp;},0);
    var score=Math.abs(sa-sb);
    if(!best||score<best.score)best={A:A,B:B,sa:sa,sb:sb,score:score};
  });
  if(!best){toast('組み合わせが見つかりません');return;}
  S.teams={A:best.A,B:best.B,sa:best.sa,sb:best.sb,diff:best.score,at:Date.now()};
  render();
}

/* ---- Experience をWebで取得（プロキシ経由） ---- */
function playerDBURL(){

    '/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent('プレイヤーDB');

function parsePlayerDB(text){
  var rows=csvRows(text),out=[],i;
  for(i=0;i<rows.length;i++){
    var r=rows[i];
    if(!r||r.length<3)continue;
    var url=String(r[2]||'').trim();
    if(url.indexOf('mgo2pc.com/profile/')<0)continue;
    var ex=parseFloat(String(r[3]||'').replace(/[^0-9.\-]/g,''));
    out.push({name:String(r[1]||'').trim(),url:url,exp:isNaN(ex)?null:ex});
  }
  return out;
}
var XP_TABLE=[0, 125, 250, 375, 500, 650, 800, 950, 1100, 1250, 1400, 1550, 1700, 1850, 2000, 2175, 2350, 2525, 2725, 2975, 3275, 3625, 4075];
function expFromXp(xp){
  if(xp===null||xp===undefined||xp==='')return null;
  xp=Number(xp);
  if(!isFinite(xp)||xp<0)return null;
  var lv=0;
  while(lv+1<XP_TABLE.length&&xp>=XP_TABLE[lv+1])lv++;
  var min=XP_TABLE[lv],next=XP_TABLE[lv+1];
  var pr=(next===undefined)?1:Math.max(0,Math.min(1,(xp-min)/(next-min)));
  return lv+pr;
}
function parseExpText(t){
  try{var j=JSON.parse(t);if(j&&j.exp!=null)return Number(j.exp);if(j&&j.xp!=null)return expFromXp(j.xp);}catch(e){}
  var lv=t.match(/GP\)\s+(\d{1,2})\s/);
  if(!lv)return null;
  var pr=t.match(/(\d{1,3})%\s+Weekly/);
  var p=pr?parseInt(pr[1],10):0;
  if(p>100)p=100;
  return parseInt(lv[1],10)+p/100;
}
function expFetchAll(){
  if(!S.proxy){toast('先に「取得プロキシURL」を設定してください');return;}
  S.expBusy=true;S.expLog=['プレイヤーDBを読込中…'];render();
  fetch(playerDBURL(),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(t){
      var db=parsePlayerDB(t);
      if(!db.length){S.expBusy=false;render();toast('プレイヤーDBからURLを読めませんでした');return;}
      S.expLog=['対象 '+db.length+'人'];
      var i=0,okN=0,ngN=0;
      function step(){
        if(i>=db.length){
          S.expBusy=false;render();
          toast('完了 成功'+okN+' / 失敗'+ngN);
          return;
        }
        var p=db[i++];
        var pu=S.proxy.replace(/\/$/,'')+'/exp?url='+encodeURIComponent(p.url);   // /exp を忘れると無言で失敗する
        fetch(pu,{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
          var e=parseExpText(t);
          if(e===null){ngN++;S.expLog.push('× '+p.name);}
          else{
            okN++;
            S.players.forEach(function(q){if(q.name===p.name)q.exp=e;});
            for(var k=0;k<S.expLog.length;k++){}
            S.expLog.push('✓ '+p.name+' '+e.toFixed(2));
          }
          if(S.expLog.length>6)S.expLog=S.expLog.slice(-6);
          render();setTimeout(step,350);
        }).catch(function(){ngN++;S.expLog.push('× '+p.name+' 通信');render();setTimeout(step,350);});
      }
      step();
    })
    .catch(function(e){S.expBusy=false;render();toast('シート読込失敗: '+e.message);});
}
/* 募集メンバーだけで振り分け直す（Workerの /plan を利用） */
function planFromRecruit(){
  var list=(S.rlog||[]).filter(function(x){return !x.quit&&x.n;});
  var names=list.map(function(x){return x.n;});
  var lis=list.filter(function(x){return x.lis;}).map(function(x){return x.n;});
  if(names.length<2){toast('募集メンバーがいません');return;}
  var base=(S.proxy||'https://wild-bread-33c3.gantz8811.workers.dev').replace(/\/$/,'');
  toast('募集メンバーで計算中…');
  fetch(base+'/plan?names='+encodeURIComponent(names.join('|'))+'&lis='+encodeURIComponent(lis.join('|')),{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(j){
      if(!j||!j.players){toast('計算できませんでした');return;}
      var byN={};(S.players||[]).forEach(function(q){byN[nk(q.name)]=q;});
      S.players=S.players||[];
      j.players.forEach(function(p){
        var hit=byN[nk(p.name)];
        if(hit){hit.exp=p.exp;hit.on=true;hit.part=true;if(p.lis)hit.lis=true;}
        else S.players.push({name:p.name,exp:p.exp,fix:'なし',lis:p.lis,part:true,on:true});
      });
      S.playersAt=Date.now();S.bench=null;rebuildPool();
      if(!j.best){ S.teams=null; toast(j.note||'偶数人ではありません'); render(); return; }
      S.teams={A:j.best.red,B:j.best.blue,sa:j.best.redTotal,sb:j.best.blueTotal,diff:j.best.diff,at:Date.now()};
      render();
      toast('募集の'+j.players.length+'人で振り分けました');
    })
    .catch(function(e){toast('通信失敗: '+e.message);});
}

function ageText(ts){
  if(!ts)return '未取得';
  var s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return s+'秒前';
  if(s<3600)return Math.floor(s/60)+'分前';
  return Math.floor(s/3600)+'時間前';
}
function teamHTML(label,team,sum,cls){
  var side=cls==='blue'?'B':'A';
  return '<div class="team '+cls+'">'+
    '<div class="team-head"><span class="mono">TEAM '+label+'</span><span class="team-sum">'+sum.toFixed(2)+'</span></div>'+
    team.map(function(p,i){return '<div class="prow tappable" data-act="moveP" data-t="'+side+'" data-i="'+i+'"><span>'+esc(p.name)+(p.lis?' 🎧':'')+'</span><b>'+p.exp.toFixed(2)+'</b></div>';}).join('')+

/* 手動で振り分けを組み替える */
function movePlayer(from,idx){
  if(!S.teams)return;
  var src=from==='A'?S.teams.A:S.teams.B;
  var dst=from==='A'?S.teams.B:S.teams.A;
  if(!src[idx])return;
  dst.push(src.splice(idx,1)[0]);
  recalcTeams();
  render();
}
function recalcTeams(){
  if(!S.teams)return;
  var f=function(a){return a.reduce(function(x,p){return x+p.exp;},0);};
  S.teams.sa=f(S.teams.A);S.teams.sb=f(S.teams.B);
  S.teams.diff=Math.abs(S.teams.sa-S.teams.sb);
  S.teams.manual=true;
}

/* ================= Discord ウェブフック ================= */
function validHook(u){return /^https:\/\/(canary\.|ptb\.)?discord(app)?\.com\/api\/webhooks\/\d{5,}\/[\w-]{20,}$/.test(u);}
function payload(a,n){
  var v=verdict(a.k,a.r,a.b,n);
  var color={red:0xE04A33,blue:0x5A8DF2,amber:0xE8A63C}[v.cls]||0xE8A63C;
  return {username:'MIX Balance',allowed_mentions:{parse:[]},
    embeds:[{title:v.head,description:v.body,color:color,
      footer:{text:'匿名集計／誰が入れたかは記録・表示していません'}}]};
}
function elected(){
  // ウェブフックを持つ端末のうち cid 最小の1台だけが送る（全員が同じ計算をするので結果は一致）
  var now=nowSec(),best=S.cid;
  for(var k in S.peers){
    var p=S.peers[k];
    if(!p.w)continue;
    if(now-p.at>20000)continue;
    if(k<best)best=k;
  }
  return best===S.cid;
}
function maybePostRecruit(){
  var r=playRecruit(rlogAll(),S.cap||12);
  if(!r.full||!S.notify||!S.webhook)return;
  var key='full'+dateKey();
  if(S.posted[key])return;
  if(!elected())return;
  S.posted[key]=true;
  var names=r.list.map(function(p,i){return (i+1)+'. '+p.n;}).join('\n');
  postState.err=null;
  fetch(S.webhook+'?wait=true',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:'MIX 募集',allowed_mentions:{parse:[]},
      embeds:[{title:'12人そろいました',description:names,color:0x5A8DF2,
        footer:{text:'自動募集／'+(S.channel||'')+' '+dateKey()}}]})})
    .then(function(res){if(!res.ok){postState.err='HTTP '+res.status;delete S.posted[key];}render();})
    .catch(function(){postState.err='通信エラー';delete S.posted[key];});
}
function maybePost(){
  var st=S.st;
  if(!S.notify||!S.webhook||!st||!st.last)return;
  if(nowSec()<st.last.at)return;
  var e=st.last.e;
  if(S.posted[e])return;
  if(!elected())return;
  if(nowSec()-st.last.at<2)return;     // 他の端末の送信を待つ
  if(lastPostAt===e)return;
  lastPostAt=e;
  postState.err=null;
  fetch(S.webhook+'?wait=true',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload(st.last,S.n||12))})
    .then(function(r){
      if(r.ok){S.posted[e]=true;publish({t:'wp',e:e,cid:S.cid});}
      else postState.err='HTTP '+r.status;
      refresh();render();
    })
    .catch(function(e2){postState.err='通信エラー';render();});
}

/* ================= タイマー ================= */
function tick(){
  var now=nowSec();
  if(!S.st)S.st=playLog(S.log,S.n||12);
  S.st.pending=!!(S.st.last&&now<S.st.last.at);
  // 新しい結論が出た瞬間の演出
  if(S.st.last&&now>=S.st.last.at&&!S.posted['_seen'+S.st.last.e]){
    S.posted['_seen'+S.st.last.e]=true;vibrate(30);refresh();render();
  }
  hb(false);
  if(S.mode==='alloc'&&!S.allocBusy&&S.players.length&&now-lastSheet>300){lastSheet=now;S.allocBusy=1;fetchSheet();setTimeout(function(){S.allocBusy=0;},5000);}
  if(S.mode==='recruit'){refreshRecruit();maybePostRecruit();}
  else maybePost();
  tickBar();
  var key=[S.st.epoch,S.st.r,S.st.b,S.st.pending,currentMine(S.st),nowSec()>=((S.st.last&&S.st.last.at)||0)?'1':'0'].join('|');
  if(key!==lastRenderKey){lastRenderKey=key;render();}
}
function startTick(){if(!tickTimer)tickTimer=setInterval(tick,1000);}

S.channel=URL_CH.length>=3?URL_CH:getLS('mixvote.channel',DEFAULT_CHANNEL);

S.name=getLS('mixvote.name','');

S.rec=playRecruit([],S.cap);
S.sheetId=getLS('mixvote.sheet',S.sheetId);

try{S.players=JSON.parse(getLS('mixvote.players','[]'))||[];S.playersAt=parseInt(getLS('mixvote.playersAt','0'),10)||0;}catch(e){S.players=[];}
if(DEMO){
  var t0=nowSec();
  if(DEMO==='idle'){ S.log=[]; }
  else if(DEMO==='voted'){ S.log=[{cid:'aa',c:'r',ts:t0}]; S.mine={epoch:0,c:'r'}; S.connected=true; }
  else if(DEMO==='pending'){ S.log=[{cid:'aa',c:'r',ts:t0-3},{cid:'bb',c:'r',ts:t0-2},{cid:'cc',c:'r',ts:t0-1}]; S.connected=true; }
  else if(DEMO==='result'){ S.log=[{cid:'aa',c:'r',ts:t0-40},{cid:'bb',c:'r',ts:t0-39},{cid:'cc',c:'r',ts:t0-38},{cid:'dd',c:'b',ts:t0-37}]; S.connected=true; S.posted={0:true}; }
  else if(DEMO==='nohook'){ S.log=[{cid:'aa',c:'b',ts:t0-40},{cid:'bb',c:'b',ts:t0-39},{cid:'cc',c:'b',ts:t0-38}]; S.connected=true; }
  S.st=playLog(S.log,S.n);
  startTick();render();
}else{
  connect();startTick();render();
}
